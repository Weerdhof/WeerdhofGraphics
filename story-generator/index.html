<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHL Story Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===================== CONTROLS ===================== -->
  <div class="panel">
    <h1>SHL Story Generator</h1>

    <div class="mode-tabs competition-tabs">
      <button class="competition-tab active" data-competition="men">Mannen</button>
      <button class="competition-tab" data-competition="women">Vrouwen</button>
    </div>

    <div class="mode-group-label">Per speelronde</div>
    <div class="mode-tabs mode-tabs-compact">
      <button class="mode-tab active" data-mode="results">Results</button>
      <button class="mode-tab" data-mode="schedule">Schedule</button>
    </div>

    <div class="men-only-group">
      <div class="mode-group-label">Per wedstrijd <span class="mode-group-tag">Mannen</span></div>
      <div class="mode-tabs mode-tabs-compact">
        <button class="mode-tab men-only-tab" data-mode="match">Match</button>
        <button class="mode-tab men-only-tab" data-mode="matchresult">Matchresult</button>
      </div>
    </div>

    <div class="mode-group-label">Seizoen</div>
    <div class="mode-tabs mode-tabs-compact">
      <button class="mode-tab" data-mode="ranking">Ranking</button>
    </div>

    <div class="field" id="roundSelectField">
      <label id="roundSelectLabel">Speelronde</label>
      <select id="roundSelect" autocomplete="off"></select>
    </div>

    <div class="field">
      <button class="btn btn-link" id="checkScoresBtn" type="button">🔗 Check score SHL site</button>
      <p class="save-status" id="checkScoresStatus" hidden></p>
      <button class="btn btn-link" id="checkStandingsBtn" type="button" hidden>🔗 Vul in vanuit SHL site</button>
      <p class="save-status" id="checkStandingsStatus" hidden></p>
      <button class="btn btn-link" id="serverSaveBtn" type="button">💾 Opslaan op server</button>
      <p class="save-status" id="serverSaveStatus" hidden></p>
    </div>

    <div class="field-row-label"><label id="matchesLabel">Wedstrijden</label></div>
    <div class="ranking-header" id="rankingHeader" hidden>
      <span class="ranking-header-num"></span>
      <span class="ranking-header-team">Team</span>
      <span class="ranking-header-col">P</span>
      <span class="ranking-header-col">PTS</span>
    </div>
    <div class="matches" id="matchesList"></div>

    <label class="upcoming-toggle bg-toggle">
      <input type="checkbox" id="transparentBgToggle">
      Transparante achtergrond (i.p.v. kleur)
    </label>

    <div class="field bg-photo-field" id="bgPhotoField" hidden>
      <label>Achtergrondfoto (optioneel)</label>
      <input type="file" id="bgPhotoInput" accept="image/*">
      <div class="bg-photo-controls" id="bgPhotoControls" hidden>
        <label class="bg-photo-zoom-label">Zoom<input type="range" id="bgPhotoZoom" min="1" max="3" step="0.01" value="1"></label>
        <button class="btn btn-link" id="removeBgPhotoBtn" type="button">✕ Verwijder foto</button>
        <p class="hint">Sleep op de preview om de foto te verschuiven.</p>
      </div>
    </div>

    <button class="btn btn-primary" id="exportBtn">⬇ Exporteer als PNG</button>
    <button class="btn btn-link" id="exportElementBtn" type="button" hidden>⬇ Exporteer zonder achtergrond</button>

    <p class="hint" id="modeHint">Kies eerst een speelronde — teams (en bij Schedule ook tijden) worden automatisch ingevuld. Scores vul je zelf in bij Results.</p>
  </div>

  <!-- ===================== PREVIEW / CANVAS ===================== -->
  <div class="preview-wrap">
    <div class="canvas-holder" id="canvasHolder">
      <canvas id="posterCanvas"></canvas>
    </div>
  </div>

</div>

<template id="resultMatchRowTemplate">
  <div class="match-row">
    <div class="match-row-line">
      <div class="team-chip home-chip">
        <span class="team-logo-wrap"><img class="team-logo"></span>
        <select class="team-select" autocomplete="off"></select>
      </div>
      <span class="score-pair">
        <input type="text" class="score-input home-score" placeholder="0" maxlength="3" inputmode="numeric" autocomplete="off">
        <span class="vs-label">–</span>
        <input type="text" class="score-input away-score" placeholder="0" maxlength="3" inputmode="numeric" autocomplete="off">
      </span>
      <input type="text" class="time-input upcoming-time" placeholder="20:00" inputmode="numeric" hidden autocomplete="off">
      <div class="team-chip away-chip">
        <select class="team-select" autocomplete="off"></select>
        <span class="team-logo-wrap"><img class="team-logo"></span>
      </div>
    </div>
    <label class="upcoming-toggle">
      <input type="checkbox" class="upcoming-checkbox">
      Nog te spelen (toont tijd i.p.v. score)
    </label>
    <div class="upcoming-date-row" hidden>
      <label class="upcoming-toggle">
        <input type="checkbox" class="show-date-checkbox">
        Andere dag dan hierboven (bv. nog een zondag)
      </label>
      <input type="text" class="date-label-input" placeholder="bv. SUNDAY 21 SEPTEMBER" hidden autocomplete="off">
    </div>
  </div>
</template>

<template id="scheduleMatchRowTemplate">
  <div class="match-row">
    <div class="match-row-line">
      <div class="team-chip home-chip">
        <span class="team-logo-wrap"><img class="team-logo"></span>
        <select class="team-select" autocomplete="off"></select>
      </div>
      <input type="text" class="time-input" placeholder="20:00" inputmode="numeric" autocomplete="off">
      <div class="team-chip away-chip">
        <select class="team-select" autocomplete="off"></select>
        <span class="team-logo-wrap"><img class="team-logo"></span>
      </div>
    </div>
    <div class="upcoming-date-row">
      <label class="upcoming-toggle">
        <input type="checkbox" class="show-date-checkbox">
        Andere dag dan hierboven (bv. nog een zondag)
      </label>
      <input type="text" class="date-label-input" placeholder="bv. SUNDAY 21 SEPTEMBER" hidden autocomplete="off">
    </div>
  </div>
</template>

<template id="singleMatchRowTemplate">
  <div class="match-row">
    <div class="match-row-line">
      <div class="team-chip home-chip">
        <select class="team-select" autocomplete="off"></select>
      </div>
      <span class="score-pair single-match-score" hidden>
        <input type="text" class="score-input home-score" placeholder="0" maxlength="3" inputmode="numeric" autocomplete="off">
        <span class="vs-label">–</span>
        <input type="text" class="score-input away-score" placeholder="0" maxlength="3" inputmode="numeric" autocomplete="off">
      </span>
      <input type="text" class="time-input single-match-time" placeholder="20:00" inputmode="numeric" autocomplete="off">
      <div class="team-chip away-chip">
        <select class="team-select" autocomplete="off"></select>
      </div>
    </div>
    <div class="single-match-date-row">
      <label>Datum / ronde</label>
      <input type="text" class="date-label-input single-match-dateround" placeholder="bv. SAT 19-09 | ROUND 3" autocomplete="off">
    </div>
  </div>
</template>

<template id="rankingRowTemplate">
  <div class="ranking-row">
    <span class="rank-num"></span>
    <select class="team-select rank-team-select" autocomplete="off"></select>
    <input type="text" class="rank-input rank-p" placeholder="P" inputmode="numeric" maxlength="2" autocomplete="off">
    <input type="text" class="rank-input rank-pts" placeholder="PTS" inputmode="numeric" maxlength="3" autocomplete="off">
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
